services:
  - type: web
    name: cg-matrix-gen-system
    runtime: node
    repo: https://github.com/bijit-create/cg-matrix-gen-system
    branch: main
    buildCommand: npm install && npm run build
    startCommand: NODE_ENV=production node --import tsx/esm server.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      # Second Gemini key for round-robin load-balancing (optional). The
      # server rotates across GEMINI_API_KEY + GEMINI_API_KEY_1.._10. Set the
      # value in the Render dashboard (sync: false keeps it out of the repo).
      - key: GEMINI_API_KEY_2
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: APP_SECRET
        sync: false
      - key: PORT
        value: "10000"
